<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        }
        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .promo-container {
            max-width: 800px;
            padding: 40px;
        }
        h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -1px;
            line-height: 1.2;
        }
        .discord-link {
            color: #5865F2;
            text-decoration: none;
            transition: color 0.2s;
        }
        .discord-link:hover {
            text-decoration: underline;
            color: #7289da;
        }
        .sub-text {
            color: #b3b3b3;
            font-size: 20px;
            font-weight: 400;
            margin-top: 20px;
            line-height: 1.5;
        }
    </style>
</head>

    <div class="promo-container">

            <a href="https://discord.gg/NpTQzMmeJ4" class="discord-link">(https://discord.gg/NpTQzMmeJ4)</a>

</html>
